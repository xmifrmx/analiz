name: Scrape Firmware & Update RSS

on:
  schedule:
    # Runs every 2 hours (12x/day). BRANDS is now a small, curated list (25
    # brands, kept in sync with https://immaculate.eu.cc/tr/markalar) instead
    # of the previous 300+ firmwarefile.com categories, so every run scrapes
    # the full brand list in one go — no more chunking/rotation needed, and
    # no more timeouts.
    - cron: "0 */2 * * *"
  workflow_dispatch: # Allow manual trigger
    inputs:
      brands:
        description: "Space-separated brand keys to scrape (e.g. 'oppo vivo'), or leave blank to scrape all brands"
        required: false
        type: string

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Rebase/Pull işlemlerinin sorunsuz çalışması için tüm commit geçmişini çeker

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Migrate old feeds/ folder to feed/ (one-time, if present)
        run: |
          if [ -d "feeds" ] && [ ! -d "feed" ]; then
            git mv feeds feed
          fi

      - name: Run scraper
        run: |
          BRANDS_INPUT="${{ github.event.inputs.brands }}"
          echo "Scraping: ${BRANDS_INPUT:-all curated brands}"
          node fetch_roms.js ${BRANDS_INPUT} --depth 50 --out-dir ./feed

      - name: Commit & push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add feed/
          git add -u feeds/ 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Auto-update firmware RSS feeds ($(date -u '+%Y-%m-%d %H:%M UTC'))"
            git pull --rebase origin main
            git push
          fi

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    needs: scrape
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

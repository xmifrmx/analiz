name: Scrape Firmware & Update RSS

on:
  schedule:
    # Run every day at 06:00 UTC
    - cron: "0 6 * * *"
  workflow_dispatch: # Allow manual trigger

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Migrate old feeds/ folder to feed/ (one-time, if present)
        run: |
          if [ -d "feeds" ] && [ ! -d "feed" ]; then
            git mv feeds feed
          fi

      - name: Run scraper
        run: node fetch_roms.js --depth 50 --out-dir ./feed

      - name: Commit & push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add feed/
          git add -u feeds/ 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Auto-update firmware RSS feeds ($(date -u '+%Y-%m-%d %H:%M UTC'))"
            git push
          fi
